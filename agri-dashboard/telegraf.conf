[agent]
  interval = "1s"
  flush_interval = "1s"

# ===== INPUT: Subscribe to MQTT =====
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["agricultural/esp32/data"]
  data_format = "json"
  json_time_format = "unix"

  # Tag the device ID
  tag_keys = ["id", "zone", "crop"]

# ===== OUTPUT: Write to InfluxDB =====
